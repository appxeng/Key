name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        run: |
          CFG=$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$CFG" ]; then
            echo "::error::capacitor.config.json not found. Upload the EXTRACTED files of the project (package.json, capacitor.config.json, www/, assets/, scripts/), not the zip."
            echo "Files in repo:"; find . -maxdepth 2 -not -path './.git*' | head -50
            exit 1
          fi
          DIR=$(dirname "$CFG")
          if [ ! -f "$DIR/package.json" ]; then
            echo "::error::package.json is missing next to capacitor.config.json ($DIR). Upload package.json too."
            exit 1
          fi
          echo "Project folder: $DIR"
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Add Android platform
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Generate icons and splash
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -d assets ]; then npx capacitor-assets generate --android; else echo "no assets folder, skipping"; fi

      - name: Native tweaks
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f scripts/patch-android.mjs ]; then node scripts/patch-android.mjs; else echo "no patch script, skipping"; fi

      - name: Sync web files
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Player-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
